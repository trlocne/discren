data:
  mmhcl_dir: ./data
  clear_cache: true
  cache_hypergraph: true
  modality_feature_files:
    text: text_feat.npy
  feature_knn:
    top_k: 10
    min_sim: 0.0
model:
  hypergraph:
    embedding_dim: 64
    ui_layers: 2
    user_layers: 2
    item_layers: 2
    temperature: 0.2
    tau_modal: 0.2
    use_item_structural: true
    use_modal_purifier: true
    rca_iterations: 3
    modal_layers: 1
    dropedge_rate: 0.3
    use_adaptive_gate: true
training:
  seed: 42
  lr: 0.0003
  emb_reg: 0.001
  save_dir: /checkpoints/clothing_full_d64
  resume: false
  epochs: 1000
  save_every: 10
  evaluate_every: 2
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  item_loss_ratio: 0.7
  user_loss_ratio: 0.1
  lambda_modal_align: 0.05
  lambda_modal_modal: 0.05
  scheduler_type: lambda_096
  scheduler_t_max: 300
  scheduler_eta_min: 1.0e-05
  hard_neg_synth_rate: 0.15
  hard_neg_pool_size: 32
llm:
  enabled: true
  use_user_profile: true
  user_profile_file: user_profile_feat.npy
  use_item_llm_text: true
  item_llm_text_file: text_llm_feat.npy
  feat_scale: 0.5
  user_feat_scale: 0.3
  item_feat_scale: 0.2
  lambda_mae: 0.2
  mae_mask_ratio: 0.3
